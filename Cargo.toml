[package]
name = "twinkly-mqtt"
version = "0.5.1"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
env_logger = "=0.11.11"
tokio = { version = "=1.54.1", features = [
	"rt",
	"rt-multi-thread",
	"net",
	"time",
	"macros",
	"sync",
	"signal",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
rumqttc = { version = "=0.25.1", default-features = false }
anyhow = "=1.0.104"
palette = { version = "=0.7.7", features = ["serializing"] }
log = "=0.4.35"
futures = "=0.3.34"
config = "=0.15.27"
byteorder = "=1.5.0"
reqwest = { version = "=0.13.5", default-features = false, features = [
	"json",
] }
base64 = "=0.23.1"
rand = "=0.10.3"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["io-util"] }
